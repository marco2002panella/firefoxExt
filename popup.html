<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 8px; font: 13px sans-serif; }
    textarea { width: 100%; box-sizing: border-box; height: 80px; font-family: monospace; }
    .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
    button { flex: 1; padding: 5px; }
    input[type=number] { width: 60px; }
    #status { margin-top: 6px; color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <textarea id="text" placeholder="Scrivi o incolla qui (layout IT)"></textarea>
  <div class="row">
    <label>Ritardo (ms) <input type="number" id="delay" min="10" max="1000" value="80"></label>
  </div>
  <div class="row">
    <button id="send">Invia</button>
    <button id="stop">Stop</button>
  </div>
  <div class="row">
    <button id="enter">Invio ⏎</button>
    <button id="bksp">Cancella ⌫</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
